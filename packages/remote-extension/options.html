<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Remote Page Agent settings</title>
    <style>
      body { max-width: 640px; margin: 32px auto; font: 16px system-ui, sans-serif; }
      label { display: block; margin: 16px 0; }
      input { box-sizing: border-box; display: block; margin-top: 6px; padding: 8px; width: 100%; }
      textarea { box-sizing: border-box; display: block; margin-top: 6px; min-height: 100px; padding: 8px; width: 100%; }
      button { padding: 8px 16px; }
      #status { margin-left: 12px; }
    </style>
  </head>
  <body>
    <h1 data-i18n="title">Remote Page Agent</h1>
    <form id="settings">
      <label><span data-i18n="bridgeUrl">Bridge WebSocket URL</span>
        <input id="bridgeUrl" type="url" required placeholder="ws://localhost:9222/agent">
      </label>
      <label><span data-i18n="token">Connection token</span>
        <input id="bridgeToken" type="password" autocomplete="off">
      </label>
      <label><input id="whitelistEnabled" type="checkbox"> <span data-i18n="whitelistEnabled">Only connect on allowed origins</span></label>
      <label><span data-i18n="whitelistOrigins">Allowed origins, one per line</span>
        <textarea id="whitelistOrigins" placeholder="https://example.com"></textarea>
      </label>
      <label><span data-i18n="language">Interface language</span>
        <select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="zh">中文</option></select>
      </label>
      <label><span data-i18n="historyLimit">Maximum history entries</span>
        <input id="commandHistoryLimit" type="number" min="1" max="200" step="1">
      </label>
      <button type="submit" data-i18n="save">Save</button><span id="status" role="status"></span>
    </form>
    <script type="module" src="dist/options.js"></script>
  </body>
</html>
