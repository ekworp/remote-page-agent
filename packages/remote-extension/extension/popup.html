<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Remote DevTools</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="styles.css">
    <style>
      body { width: 360px; background: var(--bg); color: var(--text); }
      .shell { padding: 18px; }
      .header { margin-bottom: 16px; }
      .brand { min-width: 0; }
      .logo { width: 38px; height: 38px; border-radius: 11px; box-shadow: 0 4px 12px rgb(30 50 90 / 18%); }
      .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
      .icon-button { display: inline-grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; padding: 0; border: 1px solid var(--border); background: var(--card); color: var(--muted); }
      .icon-button:hover { color: var(--accent); background: var(--accent-soft); }
      .icon-button svg { width: 17px; height: 17px; }
      .status-card { padding: 13px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
      .status-label { color: var(--muted); font-size: 12px; }
      #connections { margin-top: 2px; font-weight: 700; }
      .online { color: var(--success); }
      .offline { color: var(--muted); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 16%, transparent); }
      .dot.offline { background: var(--muted); box-shadow: none; }
      #addCurrentOrigin.allowed { background: var(--success); cursor: default; }
      #addCurrentOrigin.unavailable { background: var(--muted); cursor: default; }
      #addCurrentOrigin:disabled { cursor: default; opacity: .9; }
      .section-title { margin: 18px 0 8px; }
      #history { list-style: none; max-height: 205px; overflow: auto; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
      #history li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 11px; border-bottom: 1px solid var(--border); overflow: hidden; }
      #history li:last-child { border-bottom: 0; }
      #history .command { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #history .time { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
      .muted { color: var(--muted); }
      .success { color: var(--success); }
      .error { color: var(--danger); }
      .footer { margin-top: 16px; color: var(--muted); font-size: 11px; }
      #status { min-height: 18px; margin-top: 6px; color: var(--success); text-align: right; font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="shell container-fluid w-100">
      <header class="header d-flex align-items-center justify-content-between gap-2">
        <div class="brand d-flex align-items-center gap-2">
          <img class="logo" src="icons/icon128.png" alt="">
          <div><h1 data-i18n="title">Remote DevTools</h1><p class="subtitle" data-i18n="subtitle">Remote browser control</p></div>
        </div>
        <button id="options" class="btn btn-outline-secondary icon-button" type="button" data-i18n-label="settings" aria-label="Settings" title="Settings">
          <!-- bootstrap-gear-icon -->
        </button>
      </header>
      <section class="status-card d-flex align-items-center justify-content-between gap-3">
        <div><div class="status-label" data-i18n="connectionStatus">Connection status</div><div id="connections" class="offline"></div></div>
        <span id="statusDot" class="dot offline" aria-hidden="true"></span>
      </section>
      <button id="reconnect" class="btn btn-outline-primary w-100 mt-3" type="button" data-i18n="reconnect">Reconnect current page</button>
      <button id="addCurrentOrigin" class="btn btn-primary w-100 mt-3" type="button">Add current page</button>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="section-title d-flex align-items-center justify-content-between"><h2 class="fs-6 mb-0" data-i18n="history">Command history</h2><button id="clear" class="btn btn-outline-secondary" type="button" data-i18n="clear">Clear</button></div>
      <ul id="history"></ul>
      <footer class="footer d-flex align-items-center justify-content-center gap-1"><span data-i18n="version">Version</span><span id="version"></span></footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
