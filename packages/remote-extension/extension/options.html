<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>网页操盘手设置</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        background: var(--bg);
        color: var(--text);
      }
      .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .form-control, .form-select {
        background: var(--card);
        color: var(--text);
        border-color: var(--border);
      }
      textarea { min-height: 120px; resize: vertical; }
      .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
    </style>
  </head>
  <body>
    <main class="options-shell container">
      <header class="mb-4">
        <p class="eyebrow">Remote Page Agent</p>
        <h1 data-i18n="title">网页操盘手设置</h1>
        <p class="form-text" data-i18n="intro">Configure the bridge connection and the pages it can access.</p>
      </header>
      <form id="settings">
        <section class="card mt-3 p-3 p-md-4 shadow-sm rounded-4">
          <h2 class="fs-5 mb-1" data-i18n="connectionSection">Connection</h2>
          <p class="form-text mb-3" data-i18n="connectionDescription">Set the WebSocket bridge used by the extension.</p>
          <label class="mb-3 d-block"><span class="form-label fw-semibold" data-i18n="bridgeUrl">Bridge WebSocket URL</span>
            <input id="bridgeUrl" class="form-control" type="url" required placeholder="ws://localhost:9222/agent">
          </label>
          <label class="mb-3 d-block"><span class="form-label fw-semibold" data-i18n="token">Connection token</span>
           <input id="bridgeToken" class="form-control" type="password" autocomplete="off">
           <div class="d-flex align-items-center gap-3 mt-2"><button id="testBridge" class="btn btn-outline-secondary" type="button" data-i18n="testBridge">Test bridge</button><span id="bridgeTestStatus" class="small" role="status" aria-live="polite"></span></div>
          </label>
        </section>
        <section class="card mt-3 p-3 p-md-4 shadow-sm rounded-4">
          <h2 class="fs-5 mb-1" data-i18n="accessSection">Page access</h2>
          <p class="form-text mb-3" data-i18n="accessDescription">Limit connections to the origins listed below.</p>
          <label class="form-check d-flex align-items-center gap-2 mb-3"><input id="whitelistEnabled" class="form-check-input m-0" type="checkbox"> <span class="form-check-label" data-i18n="whitelistEnabled">Only connect on allowed origins</span></label>
          <label class="mb-3 d-block"><span class="form-label fw-semibold" data-i18n="whitelistOrigins">Allowed origins, one per line</span>
            <textarea id="whitelistOrigins" class="form-control" placeholder="https://example.com"></textarea>
          </label>
        </section>
        <section class="card mt-3 p-3 p-md-4 shadow-sm rounded-4">
          <h2 class="fs-5 mb-1" data-i18n="preferencesSection">Preferences</h2>
          <label class="mb-3 d-block"><span class="form-label fw-semibold" data-i18n="language">Interface language</span>
            <select id="language" class="form-select"><option value="auto">Auto</option><option value="en">English</option><option value="zh">中文</option></select>
          </label>
          <label class="mb-3 d-block"><span class="form-label fw-semibold" data-i18n="historyLimit">Maximum history entries</span>
            <input id="commandHistoryLimit" class="form-control" type="number" min="1" max="200" step="1">
          </label>
          <label class="mb-0 d-block"><span class="form-label fw-semibold" data-i18n="consoleLevel">Console forwarding level</span>
            <select id="consoleLevel" class="form-select">
              <option value="all" data-i18n="consoleAll">All messages</option>
              <option value="warn" data-i18n="consoleWarn">Warnings and errors</option>
              <option value="error" data-i18n="consoleError">Errors only</option>
              <option value="off" data-i18n="consoleOff">Disabled</option>
            </select>
          </label>
        </section>
        <div class="actions d-flex align-items-center gap-3 mt-4">
          <button class="btn btn-primary" type="submit" data-i18n="save">Save settings</button>
          <span id="status" class="text-success small" role="status" aria-live="polite"></span>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
