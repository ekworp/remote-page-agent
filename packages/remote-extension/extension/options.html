<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>网页操盘手设置</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        margin: 0;
        min-width: 360px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .shell { max-width: 760px; margin: 0 auto; padding: 40px 24px 56px; }
      .hero { margin-bottom: 24px; }
      .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: -.03em; }
      .intro { margin: 8px 0 0; color: var(--muted); }
      .card { margin-top: 16px; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 12px 30px rgb(30 50 90 / 7%); }
      .card h2 { margin: 0 0 4px; font-size: 18px; }
      .card-description { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
      .field { display: block; margin: 18px 0; }
      .field-label { display: block; margin-bottom: 7px; font-weight: 650; }
      input[type="url"], input[type="password"], input[type="number"], textarea, select {
        width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px;
        background: var(--card); color: var(--text); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
      }
      textarea { min-height: 120px; resize: vertical; }
      input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
      .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
      .check-row { display: inline-flex; gap: 10px; align-items: center; margin: 20px 0 8px; font-weight: 650; white-space: nowrap; }
      .check-row input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
      .origin-actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
      button.secondary { background: var(--accent-soft); color: var(--accent); }
      .actions { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
      #status { min-height: 22px; color: var(--success); font-size: 13px; }
      @media (max-width: 520px) { .shell { padding: 28px 16px 40px; } .card { padding: 18px; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Remote Page Agent</p>
        <h1 data-i18n="title">网页操盘手设置</h1>
        <p class="intro" data-i18n="intro">Configure the bridge connection and the pages it can access.</p>
      </header>
      <form id="settings">
        <section class="card">
          <h2 data-i18n="connectionSection">Connection</h2>
          <p class="card-description" data-i18n="connectionDescription">Set the WebSocket bridge used by the extension.</p>
          <label class="field"><span class="field-label" data-i18n="bridgeUrl">Bridge WebSocket URL</span>
            <input id="bridgeUrl" type="url" required placeholder="ws://localhost:9222/agent">
          </label>
          <label class="field"><span class="field-label" data-i18n="token">Connection token</span>
            <input id="bridgeToken" type="password" autocomplete="off">
          </label>
        </section>
        <section class="card">
          <h2 data-i18n="accessSection">Page access</h2>
          <p class="card-description" data-i18n="accessDescription">Limit connections to the origins listed below.</p>
          <label class="check-row"><input id="whitelistEnabled" type="checkbox"> <span data-i18n="whitelistEnabled">Only connect on allowed origins</span></label>
          <label class="field"><span class="field-label" data-i18n="whitelistOrigins">Allowed origins, one per line</span>
            <textarea id="whitelistOrigins" placeholder="https://example.com"></textarea>
          </label>
        </section>
        <section class="card">
          <h2 data-i18n="preferencesSection">Preferences</h2>
          <label class="field"><span class="field-label" data-i18n="language">Interface language</span>
            <select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="zh">中文</option></select>
          </label>
          <label class="field"><span class="field-label" data-i18n="historyLimit">Maximum history entries</span>
            <input id="commandHistoryLimit" type="number" min="1" max="200" step="1">
          </label>
        </section>
        <div class="actions">
          <button type="submit" data-i18n="save">Save settings</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
