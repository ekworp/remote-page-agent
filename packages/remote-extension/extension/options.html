<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>网页操盘手设置</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        margin: 0;
        min-width: 360px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .shell { margin: 0 auto; }
      .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: -.03em; }
      .intro { margin: 8px 0 0; color: var(--muted); }
      .card { background: var(--card); color: var(--text); border-color: var(--border); }
      .card h2 { font-size: 18px; }
      .card-description { color: var(--muted); font-size: 13px; }
      .field-label { display: block; margin-bottom: 7px; font-weight: 650; }
      input[type="url"], input[type="password"], input[type="number"], textarea, select {
        width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px;
        background: var(--card); color: var(--text); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
      }
      textarea { min-height: 120px; resize: vertical; }
      input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
      .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
      .check-row { display: inline-flex; gap: 10px; align-items: center; margin: 20px 0 8px; font-weight: 650; white-space: nowrap; }
      .check-row input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
      #status { min-height: 22px; color: var(--success); font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="shell options-shell container">
      <header class="hero mb-4">
        <p class="eyebrow">Remote Page Agent</p>
        <h1 data-i18n="title">网页操盘手设置</h1>
        <p class="intro" data-i18n="intro">Configure the bridge connection and the pages it can access.</p>
      </header>
      <form id="settings">
        <section class="card mt-3 p-3 p-md-4 shadow-sm rounded-4">
          <h2 class="mb-1" data-i18n="connectionSection">Connection</h2>
          <p class="card-description form-text mb-3" data-i18n="connectionDescription">Set the WebSocket bridge used by the extension.</p>
          <label class="field mb-3 d-block"><span class="field-label form-label" data-i18n="bridgeUrl">Bridge WebSocket URL</span>
            <input id="bridgeUrl" class="form-control" type="url" required placeholder="ws://localhost:9222/agent">
          </label>
          <label class="field mb-3 d-block"><span class="field-label form-label" data-i18n="token">Connection token</span>
            <input id="bridgeToken" class="form-control" type="password" autocomplete="off">
          </label>
        </section>
        <section class="card mt-3 p-3 p-md-4 shadow-sm rounded-4">
          <h2 class="mb-1" data-i18n="accessSection">Page access</h2>
          <p class="card-description form-text mb-3" data-i18n="accessDescription">Limit connections to the origins listed below.</p>
          <label class="check-row"><input id="whitelistEnabled" type="checkbox"> <span data-i18n="whitelistEnabled">Only connect on allowed origins</span></label>
          <label class="field mb-3 d-block"><span class="field-label form-label" data-i18n="whitelistOrigins">Allowed origins, one per line</span>
            <textarea id="whitelistOrigins" class="form-control" placeholder="https://example.com"></textarea>
          </label>
        </section>
        <section class="card mt-3 p-3 p-md-4 shadow-sm rounded-4">
          <h2 class="mb-1" data-i18n="preferencesSection">Preferences</h2>
          <label class="field mb-3 d-block"><span class="field-label form-label" data-i18n="language">Interface language</span>
            <select id="language" class="form-select"><option value="auto">Auto</option><option value="en">English</option><option value="zh">中文</option></select>
          </label>
          <label class="field mb-3 d-block"><span class="field-label form-label" data-i18n="historyLimit">Maximum history entries</span>
            <input id="commandHistoryLimit" class="form-control" type="number" min="1" max="200" step="1">
          </label>
        </section>
        <div class="actions d-flex align-items-center gap-3 mt-4">
          <button class="btn btn-primary" type="submit" data-i18n="save">Save settings</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
